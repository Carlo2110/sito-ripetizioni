<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaggio Inviato | Carlo Maria Piccolo</title>
  
  <!-- Favicon per la scheda del browser -->
  <link rel="icon" type="image/png" href="imgs/logo.png">

  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Forza la barra di scorrimento verticale per evitare saltelli di layout */
    html {
      overflow-y: scroll;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f6f9;
      justify-content: space-between;
    }

    .thank-you-main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .thank-you-card {
      background: white;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .thank-you-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .thank-you-card h1 {
      color: #2c3e50;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    .thank-you-card p {
      color: #555;
      font-size: 1.05rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    /* Riutilizza la classe del bottone principale per ereditare colore e stile esatti */
    .btn-primary {
      display: inline-block;
      padding: 12px 28px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="thank-you-main">
    <div class="thank-you-card">
      <!-- Logo circolare ingrandito -->
      <img src="imgs/logo_cerchio.png" alt="Carlo Maria Ripetizioni Logo" class="thank-you-logo">
      
      <h1>Messaggio Inviato!</h1>
      <p>Grazie per avermi contattato! La tua richiesta è stata inviata con successo. Ti risponderò al più presto all'indirizzo e-mail fornito.</p>
      
      <!-- Sfrutta la classe btn-primary definita nel tuo style.css -->
      <a href="index.html" class="btn-primary">Torna alla Home</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Carlo Maria Piccolo — Ripetizioni di Matematica e Fisica</p>
  </footer>

</body>
</html>
